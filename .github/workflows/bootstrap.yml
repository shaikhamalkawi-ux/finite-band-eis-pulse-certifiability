name: Publish reviewer reproducibility code
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand reviewer code
        shell: bash
        run: |
          cat .bootstrap/scripts00.b64 .bootstrap/scripts01.b64 > /tmp/scripts.b64
          base64 -d /tmp/scripts.b64 > /tmp/scripts.tgz
          tar -xzf /tmp/scripts.tgz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml __pycache__
      - name: Verify Python syntax and commit
        shell: bash
        run: |
          python -m py_compile *.py
          rm -rf __pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish reviewer-facing analysis code"
          git push
